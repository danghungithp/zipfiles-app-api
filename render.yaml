services:
  - type: web
    name: zipfiles-app-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        value: my-super-secret-powerautomate-key-2026
      - key: PYTHON_VERSION
        value: 3.12.0

